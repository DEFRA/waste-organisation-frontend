# ZAP / LocalStack overlay — merge after compose-github.override.yml:
#   docker compose -f compose.yml -f compose-github.override.yml -f compose-github.override-zap.yml up -d --wait
services:
  # OWASP ZAP daemon — HTTP proxy on port 8080.
  # - From other Compose services on cdp-tenant: http://zap:8080
  # - From the host (npm/WebDriver HTTP client on the runner / your laptop): http://127.0.0.1:8080
  #   (hostname "zap" only resolves inside the Compose network — not from Node on the CI runner.)
  # - Proxied targets on the host: use http://host.docker.internal:<port> (not localhost) so ZAP
  #   reaches services published on the runner / Mac (extra_hosts below maps host.docker.internal).
  # Reports: export after tests with ./compose/zap-export-report.sh (writes to ./zap-reports).
  # Trust ZAP MITM TLS in Node: export root CA to a host-writable path (not ./zap-reports —
  # that directory is bind-mounted and owned by the container user after compose starts).
  #   curl -f http://127.0.0.1:8080/OTHER/core/other/rootcert/ -o /tmp/zap-root-ca.pem
  #   export NODE_EXTRA_CA_CERTS=/tmp/zap-root-ca.pem
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    user: zap
    environment:
      ZAP_REPORTS_DIR: /home/zap/reports
    volumes:
      - ./zap-reports:/home/zap/reports:z
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - '8080'
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
      - -config
      - api.disablekey=true
    ports:
      - '8080:8080'
    # extra_hosts:
    #   - 'host.docker.internal:host-gateway'
    networks:
      - cdp-tenant

  # LocalStack: enable DynamoDB and return container-resolvable URLs for inter-service traffic.
  localstack:
    environment:
      SERVICES: s3,sqs,sns,firehose,dynamodb
      LOCALSTACK_HOST: localstack:4566
    volumes:
      - ./compose/start-localstack-dynamodb.sh:/etc/localstack/init/ready.d/start-localstack-dynamodb.sh:z

  cdp-defra-id-stub:
    environment:
      DYNAMODB_ENDPOINT: http://localstack:4566
